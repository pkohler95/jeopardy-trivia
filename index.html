<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jeopardy! Random Clue</title>
  <link rel="stylesheet" href="styles.css?v=5" />
</head>
<body>
  <header>
    <div class="logo">JEOPARDY!</div>
    <div class="header-meta">
      <span id="counter">Clue 0</span>
    </div>
  </header>

  <nav class="topics-bar" id="topics-bar" aria-label="Filter by topic">
    <button class="topic-chip active" data-topic="all">All Topics</button>
    <button class="topic-chip" data-topic="history">History</button>
    <button class="topic-chip" data-topic="science">Science</button>
    <button class="topic-chip" data-topic="literature">Literature</button>
    <button class="topic-chip" data-topic="geography">Geography</button>
    <button class="topic-chip" data-topic="sports">Sports</button>
    <button class="topic-chip" data-topic="moviesTv">Movies &amp; TV</button>
    <button class="topic-chip" data-topic="music">Music</button>
    <button class="topic-chip" data-topic="art">Art</button>
    <button class="topic-chip" data-topic="food">Food &amp; Drink</button>
    <button class="topic-chip" data-topic="wordplay">Wordplay</button>
  </nav>

  <main>
    <section class="card" id="card">
      <div class="card-meta">
        <span class="round-tag" id="round-tag">Loading…</span>
        <span class="category-tag" id="category-tag"></span>
        <span class="value-tag" id="value-tag"></span>
      </div>

      <div class="clue-text" id="clue-text">
        Fetching a random game from the J!Archive…
      </div>

      <div class="answer-box hidden" id="answer-box">
        <button class="hide-btn" id="hide-btn" aria-label="Hide answer">× Hide</button>
        <div class="answer-label">Correct response</div>
        <div class="answer-text" id="answer-text"></div>
      </div>

      <div class="controls primary-row">
        <button class="btn primary" id="reveal-btn" disabled>Show Answer</button>
      </div>
      <div class="controls nav-row">
        <button class="btn" id="back-btn" disabled>← Back</button>
        <button class="btn" id="category-next-btn" disabled>Next in Category</button>
        <button class="btn" id="next-btn" disabled>Random Next →</button>
      </div>

      <div class="source" id="source"></div>
    </section>
  </main>

  <footer>
    Live clues from <a href="https://j-archive.com/" target="_blank" rel="noopener">j-archive.com</a> — fan-maintained archive of every aired Jeopardy! episode.
  </footer>

  <script src="game.js?v=5"></script>
</body>
</html>
